version: 2
updates:
- package-ecosystem: nuget
  directory: "/src"
  schedule:
    interval: daily
  ignore:
    - dependency-name: "Microsoft.VisualStudio.Extensibility.Sdk"
    - dependency-name: "Microsoft.VisualStudio.Extensibility.Build"
  assignees:
    - "sboulema"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  assignees:
    - "sboulema"